<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2a1a14"/>
      <stop offset="100%" stop-color="#0d0807"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ダークなスクィークル背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- ティッカー帯（横スクロールしてる感を 3 本の見出しと ● で表現） -->
  <g transform="translate(0, 384)">
    <rect x="48" y="0" width="928" height="256" rx="48" ry="48"
          fill="#000000" fill-opacity="0.55" stroke="url(#accent)" stroke-width="6"/>
    <!-- 見出し1 -->
    <rect x="96"  y="92"  width="240" height="32" rx="8" fill="#ffffff"/>
    <rect x="96"  y="140" width="160" height="20" rx="6" fill="#ffffff" fill-opacity="0.55"/>
    <!-- セパレータ -->
    <circle cx="396" cy="128" r="12" fill="url(#accent)" filter="url(#glow)"/>
    <!-- 見出し2 -->
    <rect x="436" y="92"  width="300" height="32" rx="8" fill="#ffffff"/>
    <rect x="436" y="140" width="200" height="20" rx="6" fill="#ffffff" fill-opacity="0.55"/>
    <!-- セパレータ -->
    <circle cx="796" cy="128" r="12" fill="url(#accent)" filter="url(#glow)"/>
    <!-- 見出し3 (はみ出し風) -->
    <rect x="836" y="92"  width="180" height="32" rx="8" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="836" y="140" width="120" height="20" rx="6" fill="#ffffff" fill-opacity="0.4"/>
  </g>

  <!-- スクロール方向の矢印（左へ流れていることを示す）-->
  <g fill="url(#accent)" filter="url(#glow)">
    <polygon points="80,512 200,452 200,572"/>
  </g>

  <!-- 上下のミニアクセント -->
  <rect x="320" y="240" width="384" height="14" rx="7" fill="url(#accent)" fill-opacity="0.85"/>
  <rect x="320" y="780" width="384" height="14" rx="7" fill="url(#accent)" fill-opacity="0.85"/>
</svg>
